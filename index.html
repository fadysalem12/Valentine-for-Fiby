<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>
  <style>
    :root { --bg1:#ff4d6d; --bg2:#ff8fab; --card:#ffffff; --text:#1f2937; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      color:var(--text);
      overflow:hidden;
    }
    .card{
      width:min(520px, 92vw);
      background:rgba(255,255,255,.92);
      border-radius:22px;
      box-shadow:0 18px 60px rgba(0,0,0,.18);
      padding:28px 22px;
      text-align:center;
      position:relative;
    }
    h1{ margin:0 0 10px; font-size:28px; }
    p{ margin:0 0 18px; font-size:16px; opacity:.9; }
    .btns{
      position:relative;
      height:140px;
      margin-top:12px;
    }
    button{
      border:0;
      border-radius:999px;
      padding:14px 18px;
      font-size:16px;
      cursor:pointer;
      transition: transform .08s ease;
      user-select:none;
      touch-action:manipulation;
    }
    button:active{ transform: scale(.98); }
    #yes{
      background:#16a34a;
      color:white;
      position:absolute;
      left:50%;
      top:22px;
      transform:translateX(-115%);
      width:140px;
    }
    #no{
      background:#ef4444;
      color:white;
      position:absolute;
      left:50%;
      top:22px;
      transform:translateX(15%);
      width:140px;
    }
    .result{
      display:none;
      margin-top:14px;
      font-size:22px;
      font-weight:700;
    }
    .hint{
      font-size:13px;
      opacity:.7;
      margin-top:10px;
    }
    .hearts{
      position:absolute; inset:-40px -40px auto -40px;
      pointer-events:none;
      font-size:18px;
      opacity:.55;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.15));
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="hearts">💖 💘 💝 💞 💗 💓 💖 💘 💝 💞 💗 💓</div>
    <h1>Fiby… will you be my Valentine? 💘</h1>
    <p>Choose wisely 😌</p>

    <div class="btns" id="arena">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>

    <div class="result" id="result">Yayy 🥳🥳🎉🎉</div>
    <div class="hint" id="hint">Try tapping “No” 😈</div>
  </div>

  <script>
    const no = document.getElementById('no');
    const yes = document.getElementById('yes');
    const arena = document.getElementById('arena');
    const result = document.getElementById('result');
    const hint = document.getElementById('hint');

    let dodges = 0;

    function rand(min, max){ return Math.random() * (max - min) + min; }

    function moveNo(){
      dodges++;
      const a = arena.getBoundingClientRect();
      const b = no.getBoundingClientRect();

      const pad = 8;
      const maxX = a.width - b.width - pad;
      const maxY = a.height - b.height - pad;

      // random but keep inside arena
      let x = rand(pad, Math.max(pad, maxX));
      let y = rand(pad, Math.max(pad, maxY));

      // make it feel like it "runs away" from center a bit
      if (dodges % 2 === 0) y = rand(0, maxY);

      no.style.left = x + "px";
      no.style.top = y + "px";
      no.style.transform = "none";

      if (dodges >= 4) hint.textContent = "Be honest… you know the answer 😄";
      if (dodges >= 8) hint.textContent = "No is unavailable due to high demand 🤭";
    }

    // Desktop: runs away on hover
    no.addEventListener('mouseenter', moveNo);

    // Mobile: runs away when you try to tap/press it
    no.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNo();
    }, { passive:false });

    // Also run away if she clicks it somehow
    no.addEventListener('click', (e) => {
      e.preventDefault();
      moveNo();
    });

    yes.addEventListener('click', () => {
      arena.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
    });
  </script>
</body>
</html>
